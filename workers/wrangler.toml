name = "safetylink-api"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

[env.production]
routes = [
  { pattern = "api.safetylink.online/*", zone_name = "safetylink.online" }
]

[vars]
ENVIRONMENT = "production"
VAPI_BASE_URL = "https://api.vapi.ai"
VAPI_ASSISTANT_ID = "9c9313eb-8593-4c49-b993-09eef7e8d540"
ALERTS_ENABLED = "false"
