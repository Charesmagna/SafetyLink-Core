    <script data-cfasync="false">
      // Pre-paint unified Light / Deep-Navy Dark theme sync across Web, APK & EXE
      (function () {
        try {
          var savedMode = localStorage.getItem('sl_theme_mode') || localStorage.getItem('sl_global_theme') || 'dark';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = savedMode === 'system' ? (prefersDark ? 'dark' : 'light') : (savedMode === 'light' ? 'light' : 'dark');
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.classList.toggle('theme-light', resolved === 'light');
          root.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root {
        min-height: 100dvh;
        width: 100%;
        margin: 0;

        font-family: 'DM Sans', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

        50% { opacity: 0.6; transform: scale(1.05); }

      .sl-init-pulse {
        animation: sl-pulse 1.8s ease-in-out infinite;
      }
    </style>
        <script data-cfasync="false">
      // Storage Migration: Ensure decoy calculator is disabled by default for all existing browser caches
      try {
        if (localStorage.getItem('sl_decoy_migrated_v2') !== 'true') {
          localStorage.removeItem('sl_decoy_active');
          localStorage.setItem('sl_decoy_migrated_v2', 'true');
        }
      } catch (e) {}
    </script>
    <script data-cfasync="false">
      // Self-healing: Unregister broken/stale Service Workers if URL has ?fresh or ?reset (iframe-safe)
      (function() {
        try {
          if (window.location.search.includes('fresh=1') || window.location.search.includes('reset=1')) {
            var cleanUrl = window.location.pathname + window.location.hash;
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, '', cleanUrl);
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(reg) { return reg.unregister().catch(function() {}); }));
              }).catch(function() {});
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name).catch(function() {}); }));
              }).catch(function() {});
            }
          }
        } catch (e) {}
      })();

      window.__sl_mounted = false;
      window.__sl_loader_dismissed = false;
      window.__sl_boot_error = '';

      window.slDismissLoader = function() {
        window.__sl_loader_dismissed = true;
        var loader = document.getElementById('sl-initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 180ms ease';
          setTimeout(function() {
            var el = document.getElementById('sl-initial-loader');
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          }, 180);
        }
      };

      window.slForceCleanReload = function() {
        try {
          window.location.reload();
        } catch (e) {
          window.location.href = window.location.pathname + '?t=' + Date.now();
        }
      };

      window.slForceResetCache = function() {
        var nextUrl = window.location.pathname + '?fresh=1&t=' + Date.now();
        var tasks = [];
        try {
          if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(reg) { return reg.unregister().catch(function() {}); }));
              }).catch(function() {})
            );
          }
          if ('caches' in window && caches.keys) {
            tasks.push(
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(name) { return caches.delete(name).catch(function() {}); }));
              }).catch(function() {})
            );
          }
        } catch (e) {}
        Promise.all(tasks).finally(function() {
          window.location.replace(nextUrl);
        });
      };

      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        if (msg && !window.__sl_boot_error) {
          window.__sl_boot_error = String(msg).slice(0, 180);
        }
        console.error('SafetyLink Top-Level Error Caught:', e.error || e.message);
      });

      // Safety watchdog: if React has not mounted within 12s, provide a dismissible recovery card
      setTimeout(function() {
        if (!window.__sl_mounted && !window.__sl_loader_dismissed) {
          var root = document.getElementById('root');
          var loader = document.getElementById('sl-initial-loader');
          if (loader && root) {
            var errHtml = window.__sl_boot_error
              ? '<div style="margin:0 0 12px;padding:8px 10px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.35);border-radius:8px;font-size:11px;color:#fca5a5;font-family:monospace;word-break:break-word;">' +
                window.__sl_boot_error.replace(/[<>&]/g, function(c) { return ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c] || c); }) +
                '</div>'
              : '';
            loader.innerHTML =
              '<div style="position:relative;max-width:380px;width:calc(100% - 32px);margin:auto;text-align:center;padding:24px;background:rgba(15,23,42,0.92);backdrop-filter:blur(16px);border:1px solid rgba(148,163,184,0.25);border-radius:18px;box-shadow:0 24px 48px rgba(0,0,0,0.55);">' +
                '<button type="button" onclick="window.slDismissLoader()" aria-label="Close loading notice" title="Close" style="position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9999px;background:rgba(30,41,59,0.9);color:#cbd5e1;border:1px solid rgba(148,163,184,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;cursor:pointer;">&times;</button>' +
                '<div style="width:48px;height:48px;margin:0 auto 16px;background:linear-gradient(135deg,#10b981,#0f766e);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(16,185,129,0.4);">' +
                  '<svg style="width:24px;height:24px;color:#ffffff;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>' +
                '</div>' +
                '<h3 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#f8fafc;">SafetyLink Loading</h3>' +
                '<p style="margin:0 0 14px;font-size:13px;color:#94a3b8;line-height:1.5;">Still syncing assets. You can close this notice to keep waiting, or refresh below.</p>' +
                errHtml +
                '<button type="button" onclick="window.slForceCleanReload()" style="width:100%;padding:11px;background:#2563eb;color:#ffffff;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px;">Instant Refresh</button>' +
                '<button type="button" onclick="window.slForceResetCache()" style="width:100%;padding:10px;background:transparent;color:#cbd5e1;border:1px solid #334155;border-radius:10px;font-weight:500;font-size:12px;cursor:pointer;margin-bottom:8px;">Clear Cache &amp; Reset</button>' +
                '<button type="button" onclick="window.slDismissLoader()" style="width:100%;padding:9px;background:rgba(148,163,184,0.12);color:#e2e8f0;border:1px solid rgba(148,163,184,0.22);border-radius:10px;font-weight:600;font-size:12px;cursor:pointer;">Hide / Close</button>' +
              '</div>';
          }
        }
      }, 12000);
    </script>

        <div style="text-align:center;">
          <div class="sl-init-pulse" style="width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg, #1e293b, #0f172a);border:1px solid #334155;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(59,130,246,0.25);">
            <svg style="width:32px;height:32px;color:#38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

    </div>
