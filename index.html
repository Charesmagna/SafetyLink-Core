<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020408" />
    <meta name="description" content="Enterprise Emergency Command & Response Platform with BLE Wearable Integration" />
    <meta property="og:title" content="SafetyLink Core" />
    <meta property="og:description" content="Enterprise Emergency Command & Response Platform with BLE Wearable Integration" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/qcp4fx2v/image/upload/Polish_20260818_074430308" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/qcp4fx2v/image/upload/Polish_20260818_074430308" />
    <title>SafetyLink Core</title>
    <!-- Tailwind CSS styles + Google Fonts -->
    <script data-cfasync="false" src="https://js.paystack.co/v1/inline.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: auto;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #020617; /* Slate 950 */
        color: #f1f5f9;
      }
      @keyframes sl-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      .sl-init-pulse {
        animation: sl-pulse 1.8s ease-in-out infinite;
      }
    </style>
    <script data-cfasync="false">
      // Self-healing: Unregister broken/stale Service Workers if URL has ?fresh or on critical load error
      if ('serviceWorker' in navigator) {
        if (window.location.search.includes('fresh=1') || window.location.search.includes('reset=1')) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let reg of regs) { reg.unregister(); }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (let name of names) { caches.delete(name); }
                window.location.href = window.location.pathname;
              });
            }
          });
        }
      }

      // Safety watchdog: if React has not mounted within 3.5s, provide an instant recovery card
      window.__sl_mounted = false;
      setTimeout(function() {
        if (!window.__sl_mounted) {
          var root = document.getElementById('root');
          var loader = document.getElementById('sl-initial-loader');
          if (loader && root) {
            loader.innerHTML = '<div style="max-width:380px;margin:auto;text-align:center;padding:24px;background:#0f172a;border:1px solid #334155;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
              '<div style="width:48px;height:48px;margin:0 auto 16px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(239,68,68,0.4);"><span style="font-size:24px;">🛡️</span></div>' +
              '<h3 style="margin:0 0 8px;font-size:18px;font-weight:700;color:#f8fafc;">SafetyLink Loading</h3>' +
              '<p style="margin:0 0 16px;font-size:13px;color:#94a3b8;line-height:1.5;">Clearing cached local assets and synchronizing the emergency mesh network...</p>' +
              '<button onclick="window.slForceCleanReload()" style="width:100%;padding:12px;background:#2563eb;color:#ffffff;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;margin-bottom:8px;">Instant Refresh</button>' +
              '<button onclick="window.slForceResetCache()" style="width:100%;padding:10px;background:transparent;color:#94a3b8;border:1px solid #334155;border-radius:8px;font-weight:500;font-size:12px;cursor:pointer;">Clear Cache & Reset</button>' +
              '</div>';
          }
        }
      }, 3500);

      window.slForceCleanReload = function() {
        window.location.reload();
      };

      window.slForceResetCache = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let reg of regs) { reg.unregister(); }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (let name of names) { caches.delete(name); }
                window.location.href = window.location.pathname + '?fresh=1&t=' + Date.now();
              });
            } else {
              window.location.href = window.location.pathname + '?fresh=1&t=' + Date.now();
            }
          });
        } else {
          window.location.href = window.location.pathname + '?fresh=1&t=' + Date.now();
        }
      };

      window.addEventListener('error', function(e) {
        console.error('SafetyLink Top-Level Error Caught:', e.error || e.message);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="sl-initial-loader" style="height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#f8fafc;">
        <div style="text-align:center;">
          <div class="sl-init-pulse" style="width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg, #1e293b, #0f172a);border:1px solid #334155;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(59,130,246,0.25);">
            <svg style="width:32px;height:32px;color:#38bdf8;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div style="font-size:15px;font-weight:600;letter-spacing:0.05em;color:#94a3b8;font-family:monospace;">INITIALIZING SAFETYLINK</div>
        </div>
      </div>
    </div>
    <script data-cfasync="false" type="module" src="/src/main.tsx"></script>
  </body>
</html>
