name: Test FCM credentials (no message delivered)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Firebase credentials with Google
        env:
          SA: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          pip install cryptography requests > /dev/null 2>&1
          python3 - <<'PY'
          import json, os, time, base64, requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          sa = json.loads(os.environ['SA'])
          def b64(b): return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          now = int(time.time())
          header = b64(json.dumps({"alg":"RS256","typ":"JWT"}).encode())
          claims = b64(json.dumps({"iss":sa["client_email"],"scope":"https://www.googleapis.com/auth/firebase.messaging","aud":sa["token_uri"],"iat":now,"exp":now+3600}).encode())
          key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          sig = key.sign((header+"."+claims).encode(), padding.PKCS1v15(), hashes.SHA256())
          jwt = header+"."+claims+"."+b64(sig)
          t = requests.post(sa["token_uri"], data={"grant_type":"urn:ietf:params:oauth:grant-type:jwt-bearer","assertion":jwt}, timeout=30)
          print("::notice::GOOGLE LOGIN:", t.status_code, t.text[:120].replace("\n"," "))
          if t.status_code == 200:
              at = t.json()["access_token"]
              r = requests.post(f"https://fcm.googleapis.com/v1/projects/{sa['project_id']}/messages:send",
                  headers={"Authorization":"Bearer "+at}, json={"message":{"token":"fake-token-auth-check-only-000000000000000000"}}, timeout=30)
              print("::notice::FCM SEND (fake device):", r.status_code, r.text[:200].replace("\n"," "))
          PY
