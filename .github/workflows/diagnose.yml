name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe webhook like the forwarder app does
        env:
          TOK: ${{ secrets.PCM_WEBHOOK_TOKEN }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          U="https://safetylink-api.tshilidzi-mukwevho54.workers.dev/webhook/pcm/$TOK"
          note "POST empty: $(curl -s -m 20 -X POST -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "POST json test: $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"text":"test"}' -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "POST form test: $(curl -s -m 20 -X POST -H 'Content-Type: application/x-www-form-urlencoded' -d 'text=test' -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "GET test: $(curl -s -m 20 -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "bad token (expect 401): $(curl -s -m 20 -X POST -w ' [HTTP %{http_code}]' https://safetylink-api.tshilidzi-mukwevho54.workers.dev/webhook/pcm/wrong | cut -c1-200)"
