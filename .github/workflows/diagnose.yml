name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Worker (no alerts sent)
        env:
          WORKER: https://safetylink-api.tshilidzi-mukwevho54.workers.dev
          SECRET: ${{ secrets.PCM_WEBHOOK_SECRET }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          note "providers: $(curl -s -m 20 -w ' [HTTP %{http_code}]' $WORKER/api/health/providers)"
          note "health: $(curl -s -m 20 -w ' [HTTP %{http_code}]' $WORKER/api/health)"
          note "panic (empty body, expect 400 not 500): $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{}' -w ' [HTTP %{http_code}]' $WORKER/api/panic | cut -c1-200)"
          note "profile sync (bad number, expect 400): $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"phone":"x"}' -w ' [HTTP %{http_code}]' $WORKER/api/profile/sync | cut -c1-200)"
          note "pcm unsigned (expect 401): $(curl -s -m 20 -X POST -H 'X-Signature: bad' -H 'Content-Type: application/json' -d '{}' -w ' [HTTP %{http_code}]' $WORKER/webhook/pcm | cut -c1-200)"
