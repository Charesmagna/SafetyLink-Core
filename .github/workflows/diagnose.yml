name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Twilio account and Worker keys (sends no messages)
        env:
          WORKER: https://safetylink-api.tshilidzi-mukwevho54.workers.dev
          SID: ${{ secrets.TWILIO_SID }}
          TOK: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          note "WORKER providers: $(curl -s -m 20 $WORKER/api/health/providers)"
          note "TWILIO account: $(curl -s -m 20 -u "$SID:$TOK" https://api.twilio.com/2010-04-01/Accounts/$SID.json | jq -c '{status, type, friendly_name, code, message}')"
          note "TWILIO verified numbers (trial can only reach these): $(curl -s -m 20 -u "$SID:$TOK" https://api.twilio.com/2010-04-01/Accounts/$SID/OutgoingCallerIds.json | jq -c '[.outgoing_caller_ids[]?.phone_number]')"
          note "TWILIO your numbers: $(curl -s -m 20 -u "$SID:$TOK" https://api.twilio.com/2010-04-01/Accounts/$SID/IncomingPhoneNumbers.json | jq -c '[.incoming_phone_numbers[]? | {n: .phone_number, sms: .capabilities.sms, voice: .capabilities.voice}]')"
