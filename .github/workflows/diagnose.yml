name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List Cloudflare workers and routes (read only)
        env:
          CF: ${{ secrets.CF_WORKERS_TOKEN }}
          ACC: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          H="Authorization: Bearer $CF"
          note "workers: $(curl -s -m 20 -H "$H" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts | jq -c '[.result[]?.id]')"
          note "custom domains: $(curl -s -m 20 -H "$H" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/domains | jq -c '[.result[]? | {hostname, service}]')"
          note "subdomain: $(curl -s -m 20 -H "$H" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain | jq -c '.result')"
          note "d1 databases: $(curl -s -m 20 -H "$H" https://api.cloudflare.com/client/v4/accounts/$ACC/d1/database | jq -c '[.result[]? | .name]')"
