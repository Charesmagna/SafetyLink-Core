name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare + Render details
        env:
          CF: ${{ secrets.CF_WORKERS_TOKEN }}
          ACC: d089bef8b0b58c5d9506b512ec2f63dc
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          CH="Authorization: Bearer $CF"
          note "CF token verify: $(curl -s -m 20 -H "$CH" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors}')"
          note "CF workers subdomain: $(curl -s -m 20 -H "$CH" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain | jq -c '{success, sub: .result.subdomain, errors}')"
          note "CF worker scripts: $(curl -s -m 20 -H "$CH" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts | jq -c '[.result[]?.id]')"
          note "CF worker custom domains: $(curl -s -m 20 -H "$CH" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/domains | jq -c '[.result[]? | {hostname, service}]')"
          Z=$(curl -s -m 20 -H "$CH" "https://api.cloudflare.com/client/v4/zones?name=safetylink.online" | jq -r '.result[0].id // empty')
          note "CF zone id found: ${Z:+yes}"
          if [ -n "$Z" ]; then
            note "CF worker routes: $(curl -s -m 20 -H "$CH" https://api.cloudflare.com/client/v4/zones/$Z/workers/routes | jq -c '[.result[]? | {pattern, script}]')"
            note "CF DNS (api/www/apex): $(curl -s -m 20 -H "$CH" "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?per_page=100" | jq -c '[.result[]? | select(.name|test("^(api\\.|www\\.)?safetylink\\.online$")) | {type, name, content: .content[0:50], proxied}]')"
          fi
          H="Authorization: Bearer $RENDER_API_KEY"
          for ID in srv-daa67p5g1s2s73c956ag srv-daa6325g1s2s73c8nk60 srv-daa5r7p5efls73drm7q0; do
            S=$(curl -s -m 30 -H "$H" https://api.render.com/v1/services/$ID)
            note "RENDER $(echo "$S" | jq -r '"\(.name) env=\(.serviceDetails.env) docker=\(.serviceDetails.envSpecificDetails.dockerfilePath // "-") build=\(.serviceDetails.envSpecificDetails.buildCommand // "-") start=\(.serviceDetails.envSpecificDetails.startCommand // "-") url=\(.serviceDetails.url) domains=\(.serviceDetails.customDomains // "-")"' 2>&1)"
          done
