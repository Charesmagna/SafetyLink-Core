name: Diagnose Backend
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Signed probe like incoming SMS gateway app
        env:
          SECRET: ${{ secrets.PCM_WEBHOOK_SECRET }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          U="https://safetylink-api.tshilidzi-mukwevho54.workers.dev/webhook/pcm"
          BODY='{"from":"+27700000000","text":"test","sentStamp":1,"receivedStamp":1,"sim":"sim1"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" -hex | awk '{print $NF}')
          note "signed POST (expect 200): $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -H "X-Signature: $SIG" -d "$BODY" -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "unsigned POST (expect 401): $(curl -s -m 20 -X POST -H 'Content-Type: application/json' -d "$BODY" -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
          note "GET (expect 200): $(curl -s -m 20 -w ' [HTTP %{http_code}]' "$U" | cut -c1-200)"
