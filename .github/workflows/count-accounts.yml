name: Count accounts (read-only)
on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          npm install -g wrangler@4 >/dev/null 2>&1 || true
          OUT=$(npx wrangler d1 execute safetylink-core --remote --json --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM sl_profiles) AS profiles, (SELECT COUNT(*) FROM sl_contacts) AS contacts, (SELECT COUNT(*) FROM sl_device_tokens) AS devices" 2>&1)
          echo "::notice::COUNTS: $(echo "$OUT" | grep -o '"[a-z_]*": [0-9]*' | tr '\n' ' ')"
