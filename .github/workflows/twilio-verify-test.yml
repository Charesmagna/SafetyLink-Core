name: Twilio verify test (SMS + call to verified Telkom number, lists TwiML apps)
on:
  push:
    paths:
      - '.github/workflows/twilio-verify-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Twilio - list TwiML apps, send SMS, place call"
        env:
          SID: ${{ secrets.TWILIO_SID }}
          TOK: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM: ${{ secrets.TWILIO_NUMBER }}
        run: |
          TO="+27680079911"
          A=$(curl -s -m 60 -u "$SID:$TOK" "https://api.twilio.com/2010-04-01/Accounts/$SID/Applications.json?PageSize=50")
          echo "::notice::TWIML APPS: $(echo "$A" | jq -c '[.applications[]? | {sid, friendly_name, voice_url}]' | cut -c1-300)"
          S=$(curl -s -m 60 -u "$SID:$TOK" -X POST "https://api.twilio.com/2010-04-01/Accounts/$SID/Messages.json" --data-urlencode "From=$FROM" --data-urlencode "To=$TO" --data-urlencode "Body=SafetyLink Twilio test: SMS path works.")
          echo "::notice::SMS RAW: $(echo "$S" | tr -d "\n" | cut -c1-350)"
          C=$(curl -s -m 60 -u "$SID:$TOK" -X POST "https://api.twilio.com/2010-04-01/Accounts/$SID/Calls.json" --data-urlencode "From=$FROM" --data-urlencode "To=$TO" --data-urlencode 'Twiml=<Response><Say voice="alice">This is a SafetyLink Twilio test call. The call path works.</Say></Response>')
          echo "::notice::CALL RAW: $(echo "$C" | tr -d "\n" | cut -c1-350)"
