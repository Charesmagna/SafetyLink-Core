name: Deploy to Cloudflare Pages (safetylink.online)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: org-console
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: org-console
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: cfat_tlHx1K8hOs4F2qIzQUSsc7CWGmudEORDrYc5DYcLa68f67f3
          accountId: d089bef8b0b58c5d9506b512ec2f63dc
          command: pages deploy org-console/dist --project-name=safetylink --branch=main --commit-dirty=true
