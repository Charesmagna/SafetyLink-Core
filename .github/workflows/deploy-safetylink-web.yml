name: Deploy safetylink.online

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: safetylink-web
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: safetylink-web
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy
        run: wrangler pages deploy safetylink-web/dist --project-name=safetylink-online --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
