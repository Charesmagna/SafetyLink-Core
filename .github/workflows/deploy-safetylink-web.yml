name: Deploy safetylink.online

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CF_PAGES_TOKEN secret is empty or not set"
            exit 1
          else
            echo "Token is set (length: ${#CLOUDFLARE_API_TOKEN})"
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build root web application
        run: npm run build

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Pages
        run: wrangler pages deploy dist --project-name=safetylink-online --branch=main --commit-dirty=true
