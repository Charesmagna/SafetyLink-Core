name: Deploy safetylink.online

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: safetylink-web
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: safetylink-web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: d089bef8b0b58c5d9506b512ec2f63dc
          command: pages deploy safetylink-web/dist --project-name=safetylink-online --branch=main --commit-dirty=true
          preCommands: |
            wrangler pages project create safetylink-online --production-branch=main 2>/dev/null || true
