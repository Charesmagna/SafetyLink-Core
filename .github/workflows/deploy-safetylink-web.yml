name: Deploy safetylink.online

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_APP_VERSION: "1.1.${{ github.run_number }}"
          VITE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_PAGES_TOKEN }}
          accountId: d089bef8b0b58c5d9506b512ec2f63dc
          projectName: safetylink-online
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
