name: Build Windows EXE (Org Console)

on:
  push:
    branches: [main]
    paths:
      - 'org-console/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: org-console/package-lock.json

      - name: Install dependencies
        working-directory: org-console
        run: npm install

      - name: Build React app
        working-directory: org-console
        run: npm run build

      - name: Build Electron Windows EXE
        working-directory: org-console
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build

      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: SafetyLink-OrgConsole-Windows
          path: org-console/dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: orgconsole-v1.0.${{ github.run_number }}
          name: SafetyLink Org Console v1.0.${{ github.run_number }}
          files: org-console/dist-electron/*.exe
          generate_release_notes: false
          body: |
            ## SafetyLink Org Console — Windows Installer

            **Download and run** `SafetyLink-OrgConsole-Setup-*.exe`

            **Login:** Enter your Organisation ID + email + password from the SafetyLink mobile app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
