name: Build Windows EXE
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build
        
      # Placeholder for electron builder integration
      - name: Package Windows App
        run: echo "Windows packaging step. Requires electron-builder setup in package.json"
