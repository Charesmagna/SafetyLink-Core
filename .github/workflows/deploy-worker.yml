name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Install worker dependencies
        run: cd worker && npm install
      - name: Deploy Worker
        run: cd worker && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
      - name: Set Worker Secrets (only those defined in GitHub Secrets)
        run: |
          cd worker
          for NAME in JWT_SECRET INTERNAL_API_SECRET TWILIO_SID TWILIO_AUTH_TOKEN TWILIO_NUMBER VAPI_PRIVATE_KEY VAPI_PHONE_NUMBER_ID VAPI_ASSISTANT_ID AT_API_KEY AT_USERNAME BLAND_API_KEY BLAND_ORG_KEY PAYSTACK_SECRET_KEY PAYSTACK_PUBLIC_KEY RESPONSE_CENTRE_NUMBER NEON_DATA_API_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_ENDPOINT_URL_S3 RECAPTCHA_SECRET CLOUDINARY_CLOUD CLOUDINARY_KEY CLOUDINARY_SECRET WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID TWILIO_WHATSAPP_FROM PCM_WEBHOOK_SECRET; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx wrangler secret put "$NAME" --name safetylink-api >/dev/null && echo "set $NAME"
            else
              echo "skip $NAME (not in GitHub Secrets)"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_NUMBER: ${{ secrets.TWILIO_NUMBER }}
          VAPI_PRIVATE_KEY: ${{ secrets.VAPI_PRIVATE_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
          VAPI_ASSISTANT_ID: ${{ secrets.VAPI_ASSISTANT_ID }}
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          AT_USERNAME: ${{ secrets.AT_USERNAME }}
          BLAND_API_KEY: ${{ secrets.BLAND_API_KEY }}
          BLAND_ORG_KEY: ${{ secrets.BLAND_ORG_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          RESPONSE_CENTRE_NUMBER: ${{ secrets.RESPONSE_CENTRE_NUMBER }}
          NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          RECAPTCHA_SECRET: ${{ secrets.RECAPTCHA_SECRET }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          PCM_WEBHOOK_SECRET: ${{ secrets.PCM_WEBHOOK_SECRET }}
