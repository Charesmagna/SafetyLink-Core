name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Install worker dependencies
        run: cd worker && npm install

      - name: Deploy Worker
        run: cd worker && wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc

      - name: Set Worker Secrets
        run: |
          set_secret() { printf '%s' "$2" | wrangler secret put "$1" --name safetylink-api; }
          set_secret JWT_SECRET              "${{ secrets.JWT_SECRET }}"
          set_secret INTERNAL_API_SECRET     "${{ secrets.INTERNAL_API_SECRET }}"
          set_secret TWILIO_SID              "${{ secrets.TWILIO_SID }}"
          set_secret TWILIO_AUTH_TOKEN       "3a555d3f587af716d5f97dcc572604b0"
          set_secret TWILIO_NUMBER           "+16055695774"
          set_secret VAPI_PRIVATE_KEY        "${{ secrets.VAPI_PRIVATE_KEY }}"
          set_secret VAPI_PHONE_NUMBER_ID    "${{ secrets.VAPI_PHONE_NUMBER_ID }}"
          set_secret VAPI_ASSISTANT_ID       "9c9313eb-8593-4c49-b993-09eef7e8d540"
          set_secret AT_API_KEY              "${{ secrets.USSD_API_KEY }}"
          set_secret AT_USERNAME             "safetylink"
          set_secret BLAND_API_KEY           "${{ secrets.BLAND_API_KEY }}"
          set_secret PAYSTACK_SECRET_KEY     "${{ secrets.PAYSTACK_SECRET_KEY }}"
          set_secret PAYSTACK_PUBLIC_KEY     "${{ secrets.PAYSTACK_PUBLIC_KEY }}"
          set_secret RESPONSE_CENTRE_NUMBER  "+27739441222"
          set_secret NEON_DATA_API_URL       "${{ secrets.NEON_DATA_API_URL }}"
          set_secret NEON_API_KEY            "org_79fff54a952150d89c0464960770b44793b72a8014d5b552f98099fa421972c2acc6093e391d893f970d69"
          set_secret AWS_ACCESS_KEY_ID       "${{ secrets.AWS_ACCESS_KEY_ID }}"
          set_secret AWS_SECRET_ACCESS_KEY   "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          set_secret RECAPTCHA_SECRET        "6LeTRpwtAAAAAFfEQMdYWnQwQi1fhXvgFOnkNO9X"
          set_secret CLOUDINARY_CLOUD        "qcp4fx2v"
          set_secret CLOUDINARY_KEY          "882441484725546"
          set_secret CLOUDINARY_SECRET       "mM4fbl1kvoiRdKp29W1aiDWz3vQ"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc

