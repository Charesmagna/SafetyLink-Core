name: Save the heartbeat token on the server
on:
  push:
    branches: [v2]
    paths: ['.github/workflows/set-heartbeat-secret.yml']
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save HEARTBEAT_TOKEN on the Worker
        working-directory: worker
        env:
          HB: ${{ secrets.HEARTBEAT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          test -n "$HB" || { echo "::error::HEARTBEAT_TOKEN secret is missing in GitHub"; exit 1; }
          npm install --no-audit --no-fund --legacy-peer-deps >/dev/null 2>&1
          printf '%s' "$HB" | npx wrangler secret put HEARTBEAT_TOKEN --name safetylink-api && echo "::notice::heartbeat token saved"
