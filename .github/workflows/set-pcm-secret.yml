name: Set the webhook secret on the live server (one-time)
on:
  push:
    branches: [v2]
    paths: ['.github/workflows/set-pcm-secret.yml']
  workflow_dispatch:
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save PCM_WEBHOOK_SECRET on the Worker
        working-directory: worker
        env:
          PCM: ${{ secrets.PCM_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          test -n "$PCM" || { echo "::error::PCM_WEBHOOK_SECRET is empty"; exit 1; }
          npm install --no-audit --no-fund --legacy-peer-deps >/dev/null 2>&1
          printf '%s' "$PCM" | npx wrangler secret put PCM_WEBHOOK_SECRET --name safetylink-api && echo "::notice::secret saved"
          sleep 15
          C=$(curl -s -m 30 -o /tmp/r.txt -w "%{http_code}" -X POST https://safetylink-api.tshilidzi-mukwevho54.workers.dev/webhook/pcm -H 'Content-Type: application/json' -d '{"from":"+27680079911","text":"test","sentStamp":1,"receivedStamp":2,"sim":"sim1"}')
          echo "::notice::unsigned test now -> HTTP $C $(head -c 120 /tmp/r.txt)"
