name: Show signing fingerprint (SHA-1, public)
on:
  push:
    branches: [v2]
    paths: ['.github/workflows/show-sha1.yml']
  workflow_dispatch:
jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-1 and SHA-256 of the release signing key
        run: |
          keytool -list -v -keystore android/app/safetylink-release.keystore -alias safetylink -storepass 'SafetyLink2024!' 2>/dev/null | grep -E "SHA1|SHA256" | sed 's/^/::notice::/'
