name: Show signing fingerprint (SHA-1, public)
on:
  push:
    branches: [v2]
    paths: ['.github/workflows/show-sha1.yml']
  workflow_dispatch:
jobs:
  sha1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-1 and SHA-256 of the release signing key
        run: |
          base64 -d .github/secrets/release-keystore.b64 > /tmp/rel.keystore
          keytool -list -v -keystore /tmp/rel.keystore -alias safetylink -storepass 'SafetyLink2024!' > /tmp/out.txt 2>&1
          grep -E "SHA1|SHA256" /tmp/out.txt | sed 's/^/::notice::/' || true
          tail -n 3 /tmp/out.txt | sed 's/^/::notice::/'
