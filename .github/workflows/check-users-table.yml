name: Check users table (read-only)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show users columns
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          npm install -g wrangler@4 >/dev/null 2>&1 || true
          OUT=$(npx wrangler d1 execute safetylink-core --remote --json --command "PRAGMA table_info(users)" 2>&1)
          echo "::notice::COLS: $(echo "$OUT" | grep -o '"name": *"[^"]*"' | tr -s ' ' | tr '\n' ' ' | cut -c1-400)"
