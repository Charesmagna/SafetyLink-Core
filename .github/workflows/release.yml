name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npm run cap:sync

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Decode keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/safetylink-release.jks

    - name: Build signed Release APK
      working-directory: ./android
      env:
        KEYSTORE_PATH: app/safetylink-release.jks
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
          -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
          --no-daemon --no-parallel

    - name: Clean up keystore
      if: always()
      run: rm -f android/app/safetylink-release.jks

    - name: Get release tag
      id: tag
      run: echo "TAG=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG }}
        name: SafetyLink ${{ steps.tag.outputs.TAG }}
        draft: false
        prerelease: false
        files: android/app/build/outputs/apk/release/*-release.apk
        body: |
          ## SafetyLink ${{ steps.tag.outputs.TAG }}
          
          ### Installation
          Download the APK and install on Android 8.0+.
          Enable "Install from unknown sources" for your file manager.
          
          ### Required Secrets (first-time setup)
          Set in GitHub → Settings → Secrets → Actions:
          - `RELEASE_KEYSTORE_BASE64` — base64-encoded `.jks` keystore
          - `KEY_ALIAS` — key alias in the keystore
          - `KEY_PASSWORD` — key password
          - `STORE_PASSWORD` — keystore password
