name: Deploy Duetto server (v2)
on:
  push:
    branches: [v2]
    paths: ['duetto-server/**', '.github/workflows/duetto-deploy-v2.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: duetto-server
        run: npm install
      - name: Deploy
        working-directory: duetto-server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          npx wrangler deploy > d.log 2>&1; code=$?
          tail -n 25 d.log | sed 's/^/::notice::/'
          exit $code
      - name: Check live
        run: |
          sleep 20
          echo "healthz:"; curl -s -m 30 -w " [HTTP %{http_code}]\n" https://duetto-server.tshilidzi-mukwevho54.workers.dev/duetto/healthz
          echo "ice:"; curl -s -m 30 -w " [HTTP %{http_code}]\n" https://duetto-server.tshilidzi-mukwevho54.workers.dev/duetto/ice-servers | head -c 300; echo
