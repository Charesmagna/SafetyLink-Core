name: SafetyLink Quality & Bundle Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run core dispatch engine unit tests
        run: npx tsx --test src/utils/dispatchEngine.test.ts

      - name: Build production web bundle
        run: npm run build

      - name: Report Vite bundle sizes
        run: ls -lh dist/assets/*.js | sort -k5 -h
