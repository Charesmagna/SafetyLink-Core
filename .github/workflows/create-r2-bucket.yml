name: Create R2 bucket (one-time)
on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create safetylink-releases
        env:
          CF: ${{ secrets.CF_WORKERS_TOKEN }}
          ACC: d089bef8b0b58c5d9506b512ec2f63dc
        run: |
          R=$(curl -s -m 30 -X POST -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d '{"name":"safetylink-releases"}' https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets)
          echo "::notice::$(echo "$R" | jq -c '{success, errors: [.errors[]?.message]}' | cut -c1-300)"
