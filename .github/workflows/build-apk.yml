name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npm run cap:sync

    - name: Verify web assets synced to Android
      run: |
        if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
          echo "ERROR: Web assets not found in android assets. Vite build or cap sync failed."
          ls -la android/app/src/main/assets/ || true
          ls -la dist/ || echo "dist/ also missing"
          exit 1
        fi
        echo "Assets OK: 0 files synced"

    - name: Patch plugins and create init script
      run: |
        sed -i "s/classpath 'com.android.tools.build:gradle:8.13.0'/classpath 'com.android.tools.build:gradle:8.2.1'/g" android/capacitor-cordova-android-plugins/build.gradle || true
        sed -i '/android {/a \    namespace "com.tchvu3.capacitorvoicerecorder"' node_modules/capacitor-voice-recorder/android/build.gradle || true
        cat << 'INNER_EOF' > init.gradle
        allprojects {
            buildscript {
                configurations.all {
                    resolutionStrategy {
                        force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                        force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                    }
                }
            }
            configurations.all {
                resolutionStrategy {
                    force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                    force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                }
            }
        }
        INNER_EOF

    - name: Decode keystore
      run: base64 -d .github/secrets/release-keystore.b64 > android/app/safetylink-release.keystore

    - name: Write signing properties
      run: |
        cat > signing.properties << 'PROPS'
        storeFile=android/app/safetylink-release.keystore
        storePassword=SafetyLink2024!
        keyAlias=safetylink
        keyPassword=SafetyLink2024!
        PROPS
        cat > android/signing.properties << 'PROPS'
        storeFile=safetylink-release.keystore
        storePassword=SafetyLink2024!
        keyAlias=safetylink
        keyPassword=SafetyLink2024!
        PROPS
    - name: Create mock google-services.json
      run: |
        cat << 'JSON_EOF' > android/app/google-services.json
        {
          "project_info": {
            "project_number": "1234567890",
            "project_id": "safetylink-mock",
            "storage_bucket": "safetylink-mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:mock",
                "android_client_info": {
                  "package_name": "com.aistudio.safetylink.vqnztp"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "MOCK_KEY"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }
          ],
          "configuration_version": "1"
        }
        JSON_EOF

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Stop Daemons
      run: cd android && ./gradlew --stop || true

    - name: Clean Gradle Cache
      run: rm -rf ~/.gradle/caches

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew clean assembleDebug --init-script ../init.gradle --no-daemon --no-parallel --no-build-cache

    - name: Upload Debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      working-directory: ./android
      run: ./gradlew assembleRelease --init-script ../init.gradle --no-daemon --no-parallel --no-build-cache --stacktrace 2>&1 | tail -100

    - name: Rename APKs for release
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk SafetyLink-debug.apk
        cp android/app/build/outputs/apk/release/app-release.apk SafetyLink.apk 2>/dev/null || \
        cp android/app/build/outputs/apk/release/app-release-unsigned.apk SafetyLink.apk 2>/dev/null || true

    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: android/app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release with APKs
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-v1.0.${{ github.run_number }}
        name: SafetyLink Android v1.0.${{ github.run_number }}
        files: |
          SafetyLink-debug.apk
          SafetyLink.apk
        generate_release_notes: false
        body: |
          ## SafetyLink Android App

          **SafetyLink.apk** — Release build (recommended)
          **SafetyLink-debug.apk** — Debug build (for testing)

          Install on Android 8.0+. Enable "Install from unknown sources" in settings.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
