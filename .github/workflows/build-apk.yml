name: Build Android APK

on:
  push:
    branches: [ "master", "main", "beta" ]
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[channels-selected]') || contains(github.event.head_commit.message, '[ch:apk]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Bump package.json version & stamp public/version.json
      run: |
        BUILD_VER="1.1.${{ github.run_number }}"
        npm version "$BUILD_VER" --no-git-tag-version
        node -e '
          const fs = require("fs");
          const ver = process.env.BUILD_VER;
          const runNum = Number(process.env.RUN_NUM);
          const now = new Date().toISOString();
          const out = {
            version: ver,
            buildNumber: runNum,
            channel: process.env.REF_NAME === "beta" ? "beta" : "v1",
            buildTime: now,
            releaseName: `SafetyLink Core v${ver} (Official Stable v1)`,
            apkUrl: "https://safetylink-api.tshilidzi-mukwevho54.workers.dev/download/v1/safetylink.apk",
            githubApkUrl: `https://github.com/Charesmagna/SafetyLink-Core/releases/download/v${ver}/SafetyLink-v${ver}-Signed.apk`,
            liveWebUrl: "https://safetylink.online"
          };
          fs.writeFileSync("public/version.json", JSON.stringify(out, null, 2) + "\n");
        '
      env:
        BUILD_VER: "1.1.${{ github.run_number }}"
        RUN_NUM: "${{ github.run_number }}"
        REF_NAME: "${{ github.ref_name }}"

    - name: Build Web App
      env:
        VITE_APP_VERSION: "1.1.${{ github.run_number }}"
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Force Java 17 in all generated gradle files
      run: |
        echo "=== Patching capacitor.build.gradle and plugin gradle files to Java 17 ==="
        find node_modules -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} + || true
        find node_modules -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_22/JavaVersion.VERSION_17/g' {} + || true
        find android -name "capacitor.build.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} + || true
        find android -name "capacitor.build.gradle" -exec sed -i 's/JavaVersion.VERSION_22/JavaVersion.VERSION_17/g' {} + || true
        find android -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} + || true
        echo "=== Verification ==="
        grep -r "JavaVersion" android/ | grep -v ".git" || echo "No JavaVersion found (all good)"

    - name: Patch plugins and configure Google Maven Central mirror
      run: |
        sed -i "s/classpath 'com.android.tools.build:gradle:8.13.0'/classpath 'com.android.tools.build:gradle:8.2.1'/g" android/capacitor-cordova-android-plugins/build.gradle || true
        cat << 'INNER_EOF' > init.gradle
        allprojects {
            buildscript {
                repositories {
                    maven { url "https://maven-central.storage-download.googleapis.com/maven2" }
                    google()
                    mavenCentral()
                }
                configurations.all {
                    resolutionStrategy {
                        force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                        force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                    }
                }
            }
            repositories {
                maven { url "https://maven-central.storage-download.googleapis.com/maven2" }
                google()
                mavenCentral()
            }
            configurations.all {
                resolutionStrategy {
                    force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                    force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                }
            }
        }
        INNER_EOF

    - name: Decode keystore
      run: base64 -d .github/secrets/release-keystore.b64 > android/app/safetylink-release.keystore

    - name: Write signing properties
      env:
        KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -z "$KS_PASS" ] || [ -z "$KS_KEY_PASS" ]; then
          echo "::error::Missing KEYSTORE_PASSWORD or KEY_PASSWORD GitHub repository secrets."
          exit 1
        fi
        cat > android/signing.properties << PROPS
        storeFile=safetylink-release.keystore
        storePassword=${KS_PASS}
        keyAlias=${KS_ALIAS:-safetylink}
        keyPassword=${KS_KEY_PASS}
        PROPS

    - name: Set Android version (matches the release name)
      run: |
        sed -i -E "s/versionName \"[^\"]+\"/versionName \"1.1.${{ github.run_number }}\"/" android/app/build.gradle
        sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
        grep -n "versionName\|versionCode" android/app/build.gradle | head -2

    - name: Create mock google-services.json (only if the real one is missing)
      run: |
        if [ -s android/app/google-services.json ]; then echo "Real google-services.json present - keeping it"; exit 0; fi
        cat << 'JSON_EOF' > android/app/google-services.json
        {
          "project_info": {
            "project_number": "1234567890",
            "project_id": "safetylink-mock",
            "storage_bucket": "safetylink-mock.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:mock",
                "android_client_info": {
                  "package_name": "com.aistudio.safetylink.vqnztp"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "MOCK_KEY"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }
          ],
          "configuration_version": "1"
        }
        JSON_EOF

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Fix gradle-wrapper.jar
      run: |
        curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
          -o android/gradle/wrapper/gradle-wrapper.jar

    - name: Stop Daemons
      run: cd android && ./gradlew --stop || true

    - name: Build Release APK
      working-directory: ./android
      env:
        KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        KEYSTORE_ABS="${GITHUB_WORKSPACE}/android/app/safetylink-release.keystore"
        echo "Keystore path: $KEYSTORE_ABS"
        ls -la "$KEYSTORE_ABS"
        ./gradlew assembleRelease \
          -PKEYSTORE_PATH="$KEYSTORE_ABS" \
          -PKEYSTORE_PASSWORD="$KS_PASS" \
          -PKEY_ALIAS="${KS_ALIAS:-safetylink}" \
          -PKEY_PASSWORD="$KS_KEY_PASS" \
          --init-script ../init.gradle \
          --no-daemon --no-parallel
        echo "=== Build output files ==="
        find . -name "*.apk" 2>/dev/null || echo "NO APK FOUND"
        find . -name "*.aab" 2>/dev/null || echo "NO AAB FOUND"
        ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release dir" 

    - name: Rename APK
      run: |
        mkdir -p release-output
        echo "=== Searching for APK ==="
        find android -name "*.apk" 2>/dev/null
        APK=$(find android -name "*.apk" | grep -v debug | head -1)
        if [ -z "$APK" ]; then
          APK=$(find android -name "*.apk" | head -1)
        fi
        echo "Using APK: $APK"
        cp "$APK" release-output/SafetyLink-v1.1.${{ github.run_number }}-Signed.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.${{ github.run_number }}
        name: "SafetyLink Core v1.1.${{ github.run_number }}"
        prerelease: ${{ github.ref_name == 'beta' }}
        files: release-output/*.apk
        body: |
          ## SafetyLink Core v1.1.${{ github.run_number }}
          **Released by TM Media Solutions · Reg: 2018/500191/07**
          - Channel: ${{ github.ref_name == 'beta' && 'Testing / Experimental (beta)' || 'Official Stable Version 1 (main)' }}
          - Download and install directly on Android 8.0+.
          - Enable "Install from unknown sources" in settings.
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish APK to R2 (v1 Official Stable on main, beta on beta branch)
      env:
        CF: ${{ secrets.CF_WORKERS_TOKEN }}
        ACC: d089bef8b0b58c5d9506b512ec2f63dc
        BRANCH: ${{ github.ref_name }}
      run: |
        APK=$(ls release-output/*.apk | head -1)
        NAME=$(basename "$APK")
        VER=$(echo "$NAME" | sed -E 's/SafetyLink-v([0-9.]+)-Signed\.apk/\1/')
        SIZE=$(stat -c%s "$APK")
        DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        BASE="https://api.cloudflare.com/client/v4/accounts/$ACC/r2/buckets/safetylink-releases/objects"
        case "$BRANCH" in
          main) LATEST=safetylink-latest.apk; DIR=versions ;;
          beta) LATEST=safetylink-beta-latest.apk; DIR=versions-beta ;;
          version-1-archive) LATEST=safetylink-v1-latest.apk; DIR=versions-v1 ;;
          *) LATEST=safetylink-dev-latest.apk; DIR=versions-dev ;;
        esac
        KEYS="$LATEST $DIR/$NAME"
        if [ "$BRANCH" = "main" ]; then
          KEYS="$KEYS safetylink-v1-latest.apk versions-v1/$NAME"
        fi
        for KEY in $KEYS; do
          curl -sS -f -X PUT -H "Authorization: Bearer $CF" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK" "$BASE/$KEY" > /dev/null
          echo "published $KEY"
        done
        update_index() {
          local TARGET_DIR="$1"
          curl -s -H "Authorization: Bearer $CF" "$BASE/$TARGET_DIR%2Findex.json" -o old.json || true
          jq -e 'type=="array"' old.json > /dev/null 2>&1 || echo '[]' > old.json
          jq --arg v "$VER" --arg f "$NAME" --argjson s "$SIZE" --arg d "$DATE" '[{version:$v,file:$f,size:$s,date:$d}] + (map(select(.file != $f))) | .[0:30]' old.json > index.json
          curl -sS -f -X PUT -H "Authorization: Bearer $CF" -H "Content-Type: application/json" --data-binary @index.json "$BASE/$TARGET_DIR%2Findex.json" > /dev/null
          echo "version list updated: $TARGET_DIR $VER"
        }
        update_index "$DIR"
        if [ "$BRANCH" = "main" ]; then
          update_index "versions-v1"
        fi
