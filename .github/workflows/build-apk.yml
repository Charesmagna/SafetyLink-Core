name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npm run cap:sync

    - name: Patch plugins and create init script
      run: |
        sed -i "s/classpath 'com.android.tools.build:gradle:8.13.0'/classpath 'com.android.tools.build:gradle:8.2.1'/g" android/capacitor-cordova-android-plugins/build.gradle || true
        sed -i '/android {/a \    namespace "com.tchvu3.capacitorvoicerecorder"' node_modules/capacitor-voice-recorder/android/build.gradle || true
        cat << 'INNER_EOF' > init.gradle
        allprojects {
            buildscript {
                configurations.all {
                    resolutionStrategy {
                        force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                        force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                    }
                }
            }
            configurations.all {
                resolutionStrategy {
                    force 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
                    force 'org.bouncycastle:bcprov-jdk18on:1.78.1'
                }
            }
        }
        INNER_EOF

    - name: Decode keystore
      run: base64 -d .github/secrets/release-keystore.b64 > android/app/safetylink-release.keystore

    - name: Write signing properties
      run: |
        cat > android/signing.properties << 'PROPS'
        storeFile=safetylink-release.keystore
        storePassword=SafetyLink2024!
        keyAlias=safetylink
        keyPassword=SafetyLink2024!
        PROPS

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Stop Daemons
      run: cd android && ./gradlew --stop || true

    - name: Clean Gradle Cache
      run: rm -rf ~/.gradle/caches

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew clean assembleDebug --init-script ../init.gradle --no-daemon --no-parallel --no-build-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/*.apk

    - name: Build Release APK
      working-directory: ./android
      run: ./gradlew assembleRelease --init-script ../init.gradle --no-daemon --no-parallel --no-build-cache

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: android/app/build/outputs/apk/release/*.apk
