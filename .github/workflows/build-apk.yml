name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build Web (minified + obfuscated)
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=android/app/build/outputs/apk/release/SafetyLink-Core-Signed.apk

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out $SIGNED \
              $UNSIGNED
            rm -f release.keystore
          else
            keytool -genkey -v -keystore release.keystore \
              -alias safetylink -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "Safety link 2024" -keypass "Safety link 2024" \
              -dname "CN=TM Media Solutions, OU=SafetyLink Core, O=TM Media Solutions, L=Johannesburg, S=Gauteng, C=ZA"
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:"Safety link 2024" \
              --ks-key-alias safetylink \
              --key-pass pass:"Safety link 2024" \
              --out $SIGNED \
              $UNSIGNED
            rm -f release.keystore
          fi

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose \
            android/app/build/outputs/apk/release/SafetyLink-Core-Signed.apk 2>&1 | head -5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.1.${{ github.run_number }}"
          name: "SafetyLink Core v1.1.${{ github.run_number }}"
          files: android/app/build/outputs/apk/release/SafetyLink-Core-Signed.apk
          draft: false
          prerelease: false
