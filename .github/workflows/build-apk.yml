name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute version
        id: version
        run: |
          VERSION="1.1.${{ github.run_number }}"
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Bump package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build Web
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump Android versionCode + versionName
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.version }}\"/" android/app/build.gradle

      - name: Fix gradlew permissions + repair wrapper jar
        run: |
          chmod +x android/gradlew
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Release APK & AAB
        working-directory: ./android
        run: |
          echo "" | base64 -d > app/release.keystore
          export KEYSTORE_FILE=release.keystore
          export KEYSTORE_PASSWORD="SL@TMMed!a2024#Core"
          export KEY_ALIAS="safetylink"
          export KEY_PASSWORD="SL@TMMed!a2024#Core"
          ./gradlew assembleRelease bundleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SafetyLink Core ${{ steps.version.outputs.tag }}"
          body: |
            ## SafetyLink Core ${{ steps.version.outputs.tag }}
            **Released by TM Media Solutions**
            Download the APK below and install directly on Android.
            > Your data, contacts and organisation are preserved on update.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
