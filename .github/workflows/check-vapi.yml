name: Check Vapi
on:
  workflow_dispatch:

jobs:
  vapi:
    runs-on: ubuntu-latest
    steps:
      - name: Read Vapi account (no calls made)
        env:
          K: ${{ secrets.VAPI_PRIVATE_KEY }}
          PID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
          AID: ${{ secrets.VAPI_ASSISTANT_ID }}
        run: |
          note() { echo "::notice::$(echo "$1" | tr '\n' ' ' | cut -c1-380)"; }
          H="Authorization: Bearer $K"
          note "VAPI phone numbers: $(curl -s -m 20 -H "$H" https://api.vapi.ai/phone-number | jq -c 'if type=="array" then [.[] | {id: .id[0:8], provider, number: (.number // .sipUri // "-"), name}] else . end' | cut -c1-300)"
          note "VAPI configured phone id (first 8): ${PID:0:8}"
          note "VAPI configured phone lookup: $(curl -s -m 20 -H "$H" https://api.vapi.ai/phone-number/$PID | jq -c '{provider, number, status, statusReason, message, error}')"
          note "VAPI assistant: $(curl -s -m 20 -H "$H" https://api.vapi.ai/assistant/$AID | jq -c '{name, model: .model.model, modelProvider: .model.provider, voice: .voice.provider, first: (.firstMessage // "")[0:70], message, error}')"
          note "VAPI recent calls: $(curl -s -m 20 -H "$H" 'https://api.vapi.ai/call?limit=3' | jq -c 'if type=="array" then [.[] | {status, endedReason, createdAt: .createdAt[0:16]}] else . end' | cut -c1-300)"
