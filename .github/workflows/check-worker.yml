name: Check Worker
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Worker and webhook
        env:
          PCM_WEBHOOK_SECRET: ${{ secrets.PCM_WEBHOOK_SECRET }}
        run: |
          W=https://safetylink-api.d089bef8b0b58c5d9506b512ec2f63dc.workers.dev
          echo "::notice title=health workers.dev::$(curl -s -m 20 -w ' HTTP %{http_code}' $W/api/health/providers | cut -c1-300)"
          echo "::notice title=api.safetylink.online health::$(curl -s -m 20 -w ' HTTP %{http_code}' https://api.safetylink.online/api/health/providers | cut -c1-200)"
          echo "::notice title=api.safetylink.online pcm::$(curl -s -m 20 -X POST -w ' HTTP %{http_code}' https://api.safetylink.online/webhook/pcm | cut -c1-200)"
          BODY='{"from":"test","text":"connection test, no number","sentStamp":1,"receivedStamp":1,"sim":"sim1"}'
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$PCM_WEBHOOK_SECRET" | awk '{print $NF}')
          echo "::notice title=signed webhook workers.dev::$(curl -s -m 20 -X POST -H 'Content-Type: application/json' -H "X-Signature: $SIG" -d "$BODY" -w ' HTTP %{http_code}' $W/webhook/pcm | cut -c1-300)"
          echo "::notice title=unsigned webhook workers.dev::$(curl -s -m 20 -X POST -d '{}' -w ' HTTP %{http_code}' $W/webhook/pcm | cut -c1-200)"
