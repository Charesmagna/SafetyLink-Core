name: Set download domain (one-time)
on:
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Attach download.safetylink.online to the Worker
        env:
          CF: ${{ secrets.CF_WORKERS_TOKEN }}
          ACC: d089bef8b0b58c5d9506b512ec2f63dc
          ZONE: 2cf6ad4361012c2aba768b1f0cb97770
        run: |
          BODY='{"hostname":"download.safetylink.online","service":"safetylink-api","environment":"production","zone_id":"'"$ZONE"'"}'
          R=$(curl -s -m 60 -X PUT -H "Authorization: Bearer $CF" -H "Content-Type: application/json" -d "$BODY" https://api.cloudflare.com/client/v4/accounts/$ACC/workers/domains)
          echo "::notice::$(echo "$R" | jq -c '{success, hostname: .result.hostname, errors: [.errors[]?.message]}' | cut -c1-300)"
          sleep 60
          H=$(curl -sI -m 60 https://download.safetylink.online/download/safetylink.apk)
          echo "::notice::$(echo "$H" | grep -iE '^HTTP|content-length' | tr -d '\r' | tr '\n' ' ' | cut -c1-200)"
