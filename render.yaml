# SafetyLink Core — Render Web Service Blueprint
# Hosts the stateful Node/Express backend (server.ts) for Kleva Live Voice WebSockets,
# Firebase Admin, Safety Feed, and Super Admin APIs.
# All sensitive keys are configured with sync: false so secrets are entered ONLY in the Render Dashboard.

services:
  - type: web
    name: safetylink-core-backend
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        sync: false
      - key: FREENEWSAPI_KEY
        sync: false
      - key: BIGDATACLOUD_API_KEY
        sync: false
      - key: DEEPAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: IOT_WEBHOOK_SECRET
        sync: false
      - key: PCM_WEBHOOK_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
